scope:
  id: examined-corpus
  meaning: Only the specified passages and editions actually inspected, not all Wilber publications.
  target_corpus: Thirteen catalog works plus selected Kosmos II excerpts.
  examined_so_far: [ip-local, ses-local, is-selections, kosmos-a-online, rot-introduction]
  limitations:
    - Selected passages and later editions do not establish historical priority or complete corpus coverage.
    - A target work is not an examined work; missing appearances mean unexamined, not absent.
    - Publication year, composition date, and date of an inspected edition are distinct.
    - No influence edge may be inferred from semantic similarity.
    - Confidence concerns attribution and the stated textual claim, not the truth of Wilber's theory.
  accepted_jobs:
    - Understand emergence, revision, and integration across the intellectual project.
    - Trace one concept through confirmed formulations and later uses.
    - Identify what one book carries forward and contributes.
    - Compare retained, rejected, differentiated, and added claims between works.
    - Eventually share a self-contained sourced overview.

contract:
  ids: Stable lowercase kebab-case; catalog work IDs are existing filenames without .md.
  concept_identity: >-
    Concepts are editorial research families, not assertions that every historical
    formulation is identical. Definitions delimit the search; aliases are search
    aids, not evidence of historical equivalence. Split a family if the research
    finds differences that cannot be expressed as a qualified formulation.
  appearances:
    required: [id, concept, role, claim, rationale, evidence, confidence, confidence_reason, scope, date]
    target_fields: [work, source_unit]
    evidence_required: [source, kind, citation, locator]
    target: >-
      Use work for catalog works. For uncatalogued excerpts use source_unit instead
      of work, exactly one target per appearance. No invented catalog slug.
    multiplicity: Multiple roles per concept/work require separate claims and records.
    priority: >-
      introduces requires priority_basis with examined_targets (work/source_unit
      objects), search_method and remaining_gaps (a list, possibly empty).
      Say earliest confirmed in the examined
      corpus; never first ever. None of the seed examples establishes priority.
    comparison: >-
      develops, revises, restates and applies require comparison_ids referencing
      comparisons of the same type whose later endpoint is this appearance.
      Use expounds when historical contribution has not been established.
      integrates requires integrates_concepts; integration within one formulation
      does not itself establish historical novelty. Historical integration needs
      an explicit comparison. Do not infer restatement from lack of comparison.
    evidence_shape: Nonempty list; source registry supplies edition/access details.
  terminology:
    required: [id, concept, term, claim, evidence, confidence, confidence_reason, scope, date]
    target: Same work or source_unit rule as appearances.
    rule: >-
      Record observed wording separately from conceptual formulation. A later name
      cannot date the underlying idea. Absence from this list means not researched.
  work_relationships:
    required: [id, from, to, type, claim, rationale, evidence, confidence, confidence_reason, scope, revision_extent, date]
    direction: Earlier/source catalog entry to later/derived catalog entry.
    rule: Edition identity and reuse are bibliographic relationships, not conceptual roles.
    revision_extent_values: [unknown, compared]
    comparison: compared requires comparison_citation pointing to the actual textual comparison; do not invent percentages.
  comparisons:
    required: [id, earlier, later, type, claim, rationale, evidence, confidence, confidence_reason, scope, date]
    endpoints: earlier is a nonempty list of distinct appearance IDs; later is a different appearance ID.
    evidence: >-
      Every evidence item has supports naming an endpoint appearance ID. Every
      endpoint needs evidence from a source also cited in that appearance.
      Comparison confidence is assessed separately from each passage's confidence.
    chronology: >-
      Earlier/later express a proposed direction requiring human verification,
      not chronology inferred from work slugs. Known reversed dates are invalid.
      Unknown edition chronology must be explicit in the date reason and rationale.
    comparison_basis: The endpoint records plus per-endpoint evidence are the structured comparison basis.
  date:
    required: [basis, year, reason]
    rule: >-
      Required for all appearances, terms, comparisons and work relationships.
      year is the year justified for this assertion, not copied from the work.
      unresolved requires null; original-edition-verified requires an integer.
      later-edition-only dates the inspected version, if known; retrospective-attribution
      dates the attributed event, if known, without certifying it. Evidence for
      dating belongs in the record's evidence. Never auto-fill a missing year.
  unresolved_findings:
    required: [id, question, works, evidence, gap, next_action, scope]
    rule: Findings are research gaps, not appearance or lineage edges.
  visibility: >-
    No automatic overview eligibility. Audit in wilberwiki-at6.4.4 precedes visual
    use; low-confidence and mentions records normally remain detail-only. Do not
    draw continuity across missing evidence or imply equal phase boundaries.

vocabularies:
  roles:
    introduces: Earliest confirmed substantive formulation in the explicitly examined corpus.
    expounds: Substantial exposition without an established addition relative to an earlier formulation.
    develops: Supported addition relative to an identified earlier formulation.
    revises: Explicit change or rejection of an earlier formulation, with both sides identified.
    integrates: Combines identified concepts within a larger architecture.
    applies: Uses an existing framework in a specified domain or practice.
    restates: Positively evidenced re-presentation of an identified earlier formulation.
    mentions: Present without substantive treatment.
  work_relationship_types:
    retitled-edition: Later edition of the same work under a different title; revision extent separate.
    revised-edition: Documented revised edition; magnitude must be independently established.
    abridgment: Documented shortening of a source work, not merely a shorter treatment of similar ideas.
    anthology-extraction: Documented inclusion of source passages in a collection.
    edition-identity: Two catalog entries documented as editions of one work without a stronger classification.
    popularized-restatement: Documented accessible re-presentation, not necessarily textual abridgment.
    expanded-treatment: Documented expansion from a precursor; does not assert edition identity.
  source_kinds:
    primary-text: Direct inspection of the author's argument in the identified text/edition.
    author-retrospective: Author's later account of earlier thought; not inspection of that earlier text.
    bibliographic-record: Publication, edition, authorship, or contents metadata only.
    publisher-description: Publisher summary; limited support for broad subject or positioning.
    independent-scholarship: Attributed scholarly interpretation distinct from the author's account.
    editorial-inference: Explicit researcher inference grounded in cited passages, not a primary statement.
  confidence:
    high: Direct unambiguous evidence supports the narrowly worded claim; edition and locator specified.
    medium: Indirect or retrospective support, interpretive mapping, or a material edition/coverage limitation.
    low: Tentative interpretation with identified weak support; retain as a research lead.
  comparison_types:
    develops: Adds distinctions or argument relative to the cited earlier formulation.
    revises: Changes or rejects an identified earlier claim.
    retains: Preserves a specified feature; recurrence does not imply influence.
    differentiates: Separates previously combined features with evidence for the earlier combination.
    integrates: Combines the identified earlier formulations in a later architecture.
    applies: Carries an identified framework into a specified domain or practice.
    restates: Re-presents a specified earlier formulation with positive supporting evidence.
  date_bases:
    original-edition-verified: Relevant claim verified in the original edition, with dating evidence.
    later-edition-only: Verified only in a later version; not automatically attributable to first publication.
    retrospective-attribution: Later source attributes a claim or change to an earlier date.
    unresolved: Insufficient evidence to assign a year; keep year null.
  coverage_statuses:
    unexamined: No substantive passage inspected for this ledger.
    seed-only: Selected passages inspected; book-wide coverage incomplete.
    researched: Relevant passages searched and documented; not an absence assertion by itself.
  absence: >-
    Negative claims require a recorded search scope and method. No empty list or
    unexamined status is evidence of conceptual absence.


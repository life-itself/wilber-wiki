concepts:
  - id: spectrum-levels
    label: Spectrum and levels of consciousness
    aliases: [spectrum of consciousness, levels, waves, Great Nest]
    definition: Ordered ranges of consciousness; record changing ontological and psychological meanings in each claim.
  - id: return-and-development
    label: Return to unity and developmental growth
    aliases: [recaptured-goodness, growth-to-goodness]
    definition: Competing accounts of spiritual realization as recovery of lost unity or development of capacities.
  - id: pre-trans-fallacy
    label: Pre/trans fallacy
    aliases: [prepersonal and transpersonal, pre-rational and transrational]
    definition: Confusion of pre-rational and transrational conditions because neither is ordinary rationality.
  - id: structures-stages
    label: Structures and stages
    aliases: [basic structures, developmental stages]
    definition: Enduring organizations and developmental sequences; related to levels but not synonymous in every use.
  - id: states
    label: States of consciousness
    aliases: [altered states, peak experiences]
    definition: Modes or temporary conditions of experience, distinguished from enduring developmental structures.
  - id: developmental-lines
    label: Developmental lines
    aliases: [streams, lines of development]
    definition: Capacities that can develop with relative independence and uneven attainment.
  - id: types
    label: Types
    aliases: [horizontal types, typologies]
    definition: Patterns distinguished horizontally rather than ranked as developmental attainment.
  - id: self-system
    label: Self-system
    aliases: [proximate self, distal self, overall self]
    definition: Identity, navigation, and integration of development; distinguish component selves within this family.
  - id: evolution-involution
    label: Evolution and involution
    aliases: [Eros, involution]
    definition: Accounts of unfolding and its ground or prior movement; track metaphysical and later reinterpretations separately.
  - id: holons-holarchy
    label: Holons and holarchy
    aliases: [whole-parts, holarchy]
    definition: Entities as both wholes and parts, and their nested relations; borrowing and first use need evidence.
  - id: four-quadrants
    label: Four quadrants
    aliases: [quadrants, interior-exterior and individual-collective]
    definition: Subjective, behavioral, cultural, and social dimensions considered together.
  - id: big-three
    label: The Big Three
    aliases: [I-we-it, art-morals-science]
    definition: Subjective, intersubjective, and objective domains; relationship to four quadrants must be sourced.
  - id: aqal
    label: AQAL integration
    aliases: [all-level all-quadrant, all quadrants all levels]
    definition: Integrating formulation whose included dimensions and exact wording must be dated separately.
  - id: perspectives-zones
    label: Perspectives and zones
    aliases: [eight zones, indigenous perspectives]
    definition: Differentiations of perspectives within and on domains; not automatically equivalent to quadrants.
  - id: methodological-pluralism
    label: Integral methodological pluralism
    aliases: [IMP, methodological pluralism]
    definition: Coordination of multiple methods of inquiry; distinguish early pluralism from the explicitly named formulation.
  - id: state-stage-relations
    label: State-stage relations
    aliases: [Wilber-Combs lattice, states interpreted through structures]
    definition: Relations between experiential states and developmental structures; named lattice and precursors require separate records.
  - id: integral-post-metaphysics
    label: Integral post-metaphysics
    aliases: [postmetaphysics, post-metaphysical spirituality]
    definition: Reworking spiritual and ontological claims through perspectives and conditions of disclosure.
  - id: integral-practice-wholeness
    label: Integral practice and wholeness
    aliases: [integral practice, radical wholeness]
    definition: Coordination of practical cultivation across dimensions; later named practices are formulations to verify, not timeless aliases.

appearances:
  - id: ip-quadrants-integration
    concept: four-quadrants
    work: 2000-integral-psychology
    role: integrates
    claim: IP places levels and developmental lines within all four quadrants in its account of psychological development.
    rationale: The passage explicitly combines quadrant development with levels, lines, and the subject's capacity to grasp the quadrants.
    integrates_concepts: [spectrum-levels, developmental-lines]
    evidence:
      - source: ip-local
        kind: primary-text
        citation: Integral Psychology, chapter 14, note 20.
        locator: 'library/2000-integral-psychology-full-text.md, lines 3115–3119; paragraph beginning The integral psychology that I am presenting.'
        verification_excerpt: following all of the levels and lines in all of the quadrants
    confidence: high
    confidence_reason: Direct explicit combination in the inspected text; no claim that IP originated the combination or that it is empirically validated.
    scope: examined-corpus
    date:
      basis: later-edition-only
      year: null
      reason: Inspected local EPUB has 2011 metadata but was not collated against the 2000 print edition; no verified passage date assigned.
  - id: ip-self-distinctions
    concept: self-system
    work: 2000-integral-psychology
    role: expounds
    claim: IP distinguishes proximate, distal, and overall self and explains development through the subject becoming an object of awareness.
    rationale: Chapter 3 gives a substantive account of the distinctions and their developmental mechanism, beyond a passing mention.
    evidence:
      - source: ip-local
        kind: primary-text
        citation: Integral Psychology, chapter 3, The Self, The Self as the Navigator of the Waves and Streams.
        locator: 'library/2000-integral-psychology-full-text.md, lines 637–645; paragraphs defining I and me and their developmental relationship.'
        verification_excerpt: the subject of one stage becomes an object of the next
    confidence: high
    confidence_reason: Distinctions and mechanism explicit; expounds makes no claim of novelty over earlier books.
    scope: examined-corpus
    date:
      basis: later-edition-only
      year: null
      reason: Inspected local EPUB has 2011 metadata but no original-print collation; copyright date alone does not verify passage priority.
  - id: ip-state-structure-relations
    concept: state-stage-relations
    work: 2000-integral-psychology
    role: expounds
    claim: IP explicitly discusses states interpreted through different structures and distinguishes structures, states, and realms.
    rationale: The extended discussion of Combs supplies substantive distinctions; it is not evidence of the later lattice name.
    evidence:
      - source: ip-local
        kind: primary-text
        citation: Integral Psychology, chapter 12, note 12.
        locator: 'library/2000-integral-psychology-full-text.md, lines 2941–2959; especially paragraph beginning Combs says he needs to do this.'
        verification_excerpt: psychic, subtle, causal, or nondual states interpreted by archaic, magic, mythic, or mental structures
      - source: ip-local
        kind: author-retrospective
        citation: Integral Psychology, chapter 12, note 12, retrospective reference to A Sociable God (1983).
        locator: 'library/2000-integral-psychology-full-text.md, line 2957.'
        limitation: Supports an earlier-work research lead only; A Sociable God has not been directly inspected here.
    confidence: high
    confidence_reason: High for the discussion present in IP only; retrospective dating to 1983 is not independently established by this seed.
    scope: examined-corpus
    date:
      basis: later-edition-only
      year: null
      reason: Discussion verified in the local EPUB; its retrospective reference to 1983 is not this passage's independently verified date.


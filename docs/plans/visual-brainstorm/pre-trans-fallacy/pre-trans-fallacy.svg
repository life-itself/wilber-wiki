<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" data-og="0 0 1200 630" data-square="0 -200 1200 1200" role="img" aria-labelledby="ptf-title ptf-desc">
<style>
:root{
  --wv-paper: #f8f6f1;
  --wv-surface: #fffdf9;
  --wv-ink: #1c1917;
  --wv-ink-soft: #57534e;
  --wv-muted: #6f6861;
  --wv-line: #ddd7cd;
  --wv-line-strong: #aaa198;
  --wv-level: #4338ca;
  --wv-level-fill: rgba(67, 56, 202, 0.10);
  --wv-state: #b45309;
  --wv-state-fill: rgba(180, 83, 9, 0.14);
  --wv-fallacy: #be123c;
  --wv-fallacy-fill: rgba(190, 18, 60, 0.11);
  --wv-ground: #0f766e;
  --wv-ground-fill: rgba(15, 118, 110, 0.13);
  --wv-neutral-fill: rgba(28, 25, 23, 0.055);
  --wv-accent: #b45309;
  --wv-accent-ring: rgba(217, 119, 6, 0.25);
  --wv-serif:"Fraunces","Iowan Old Style",Georgia,"Times New Roman",serif;--wv-sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wv-paper: #121110;
  --wv-surface: #1b1917;
  --wv-ink: #f0ebe3;
  --wv-ink-soft: #b8b0a6;
  --wv-muted: #978e84;
  --wv-line: #312d29;
  --wv-line-strong: #534c45;
  --wv-level: #a5b4fc;
  --wv-level-fill: rgba(165, 180, 252, 0.16);
  --wv-state: #f5b041;
  --wv-state-fill: rgba(245, 176, 65, 0.18);
  --wv-fallacy: #fb7185;
  --wv-fallacy-fill: rgba(251, 113, 133, 0.17);
  --wv-ground: #3dd6c0;
  --wv-ground-fill: rgba(61, 214, 192, 0.16);
  --wv-neutral-fill: rgba(240, 235, 227, 0.075);
  --wv-accent: #f5b041;
  --wv-accent-ring: rgba(245, 176, 65, 0.25);
  }}
:root[data-theme="dark"]{
  --wv-paper: #121110;
  --wv-surface: #1b1917;
  --wv-ink: #f0ebe3;
  --wv-ink-soft: #b8b0a6;
  --wv-muted: #978e84;
  --wv-line: #312d29;
  --wv-line-strong: #534c45;
  --wv-level: #a5b4fc;
  --wv-level-fill: rgba(165, 180, 252, 0.16);
  --wv-state: #f5b041;
  --wv-state-fill: rgba(245, 176, 65, 0.18);
  --wv-fallacy: #fb7185;
  --wv-fallacy-fill: rgba(251, 113, 133, 0.17);
  --wv-ground: #3dd6c0;
  --wv-ground-fill: rgba(61, 214, 192, 0.16);
  --wv-neutral-fill: rgba(240, 235, 227, 0.075);
  --wv-accent: #f5b041;
  --wv-accent-ring: rgba(245, 176, 65, 0.25);
  }
svg{font-family:var(--wv-sans);color:var(--wv-ink);background:var(--wv-paper)}
.t-title,.t-sub,.t-name,.t-name-s,.t-quote,.t-quote-s{font-family:"Fraunces","Iowan Old Style",Georgia,serif}
.wv-ghost{opacity:0}

{ color: var(--wv-ink); }
text { font-family: var(--wv-sans); fill: currentColor; }

/* type roles */
.t-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 2.2px; fill: var(--wv-muted); }
.t-title   { font-family: var(--wv-serif); font-size: 46px; font-weight: 600; letter-spacing: -0.6px; }
.t-sub     { font-family: var(--wv-serif); font-size: 19px; font-style: italic; fill: var(--wv-ink-soft); }
.t-head    { font-size: 12px; font-weight: 600; letter-spacing: 2px; fill: var(--wv-muted); }
.t-name    { font-family: var(--wv-serif); font-size: 28px; font-weight: 600; }
.t-name-s  { font-family: var(--wv-serif); font-size: 20px; font-weight: 600; }
.t-label   { font-size: 13px; }
.t-label-b { font-size: 13px; font-weight: 600; }
.t-small   { font-size: 11px; }
.t-soft    { fill: var(--wv-ink-soft); }
.t-mute    { fill: var(--wv-muted); }
.t-quote   { font-family: var(--wv-serif); font-size: 16px; }
.t-quote-s { font-family: var(--wv-serif); font-size: 14px; }
.t-loc     { font-size: 11px; fill: var(--wv-muted); }
.t-ours    { font-size: 11px; font-style: italic; fill: var(--wv-muted); }
.t-foot    { font-size: 10.5px; fill: var(--wv-muted); }
.t-mark    { font-size: 11px; font-weight: 600; letter-spacing: 1px; fill: var(--wv-muted); }

/* semantic colour roles: text, stroke, fill */
.c-level   { fill: var(--wv-level); }   .s-level   { stroke: var(--wv-level); }   .f-level   { fill: var(--wv-level-fill); }
.c-state   { fill: var(--wv-state); }   .s-state   { stroke: var(--wv-state); }   .f-state   { fill: var(--wv-state-fill); }
.c-fallacy { fill: var(--wv-fallacy); } .s-fallacy { stroke: var(--wv-fallacy); } .f-fallacy { fill: var(--wv-fallacy-fill); }
.c-ground  { fill: var(--wv-ground); }  .s-ground  { stroke: var(--wv-ground); }  .f-ground  { fill: var(--wv-ground-fill); }
.c-ink     { fill: currentColor; }      .s-ink     { stroke: currentColor; }      .f-neutral { fill: var(--wv-neutral-fill); }
.f-paper   { fill: var(--wv-paper); }   .f-surface { fill: var(--wv-surface); }
.s-line    { stroke: var(--wv-line-strong); } .s-faint { stroke: var(--wv-line); }
.nf        { fill: none; }

/* stroke vocabulary */
.w-hair   { stroke-width: 1; }
.w-struct { stroke-width: 1.5; }
.w-path   { stroke-width: 2.5; stroke-linecap: round; }
.w-arc    { stroke-width: 3.5; stroke-linecap: round; }
.k-solid  { stroke-dasharray: none; }
.k-dash   { stroke-dasharray: 7 6; }
.k-dot    { stroke-dasharray: 1.5 5; stroke-linecap: round; }
</style>
  <title id="ptf-title">The Pre/Trans Fallacy</title>
  <desc id="ptf-desc">Left: a vertical spectrum in three bands, from bottom to top prerational, rational, transrational, with an axis reading pre-ego to ego to trans-ego. Right: what the untutored eye sees, only two bins, rational and nonrational; dashed lines carry both the prerational and the transrational band into the single nonrational bin. Along the spectrum's edges, two arrows mark the two errors: reductionism, Freud, reads the transrational down as prerational; elevationism, Jung, reads the prerational up as transrational. Below, two verbatim passages from Sex, Ecology, Spirituality chapter 6.</desc>
  <defs>
    <marker id="ptf-m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="c-ink"/></marker>
    <marker id="ptf-m-fallacy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="c-fallacy"/></marker>
  </defs>

  <!-- title block (always visible) -->
  <text x="60" y="48" class="t-eyebrow">WILBER WIKI · A CONCEPT IN ONE PICTURE</text>
  <text x="60" y="104" class="t-title">The Pre/Trans Fallacy</text>
  <text x="60" y="140" class="t-sub">Why what comes <tspan font-weight="600">before</tspan> reason gets mistaken for what comes <tspan font-weight="600">after</tspan> it, and the two mistakes that follow.</text>

  <!-- step 0: what development does -->
  <text x="270" y="186" text-anchor="middle" class="t-head">WHAT DEVELOPMENT DOES</text>
  <line x1="74" y1="620" x2="74" y2="208" class="s-ink w-struct" marker-end="url(#ptf-m-ink)"/>
  <text transform="translate(58 410) rotate(-90)" text-anchor="middle" class="t-small t-mute" letter-spacing="1">pre-ego → ego → trans-ego</text>

  <rect x="100" y="200" width="340" height="140" class="f-level s-level w-hair"/>
  <rect x="100" y="340" width="340" height="140" class="f-neutral s-ink w-hair"/>
  <rect x="100" y="480" width="340" height="140" class="f-ground s-ground w-hair"/>

  <text x="270" y="278" text-anchor="middle" class="t-name">transrational</text>
  <text x="270" y="302" text-anchor="middle" class="t-label t-soft">mystical · contemplative · postformal</text>
  <text x="270" y="320" text-anchor="middle" class="t-small t-mute">beyond reason, not beneath it</text>

  <text x="270" y="402" text-anchor="middle" class="t-name">rational</text>
  <text x="270" y="426" text-anchor="middle" class="t-label t-soft">the ego · formal reason</text>

  <text x="270" y="528" text-anchor="middle" class="t-name">prerational</text>
  <text x="270" y="552" text-anchor="middle" class="t-label t-soft">infantile · egocentric · magical · mythic</text>
  <text x="270" y="570" text-anchor="middle" class="t-small t-mute">before reason</text>

  <!-- step 1: what the untutored eye sees -->
  <g class="wv-fade">
    <text x="960" y="186" text-anchor="middle" class="t-head">WHAT THE UNTUTORED EYE SEES</text>
    <rect x="780" y="200" width="360" height="140" class="f-neutral s-ink w-hair"/>
    <text x="960" y="262" text-anchor="middle" class="t-name">rational</text>
    <text x="960" y="286" text-anchor="middle" class="t-label t-soft">seen as what it is</text>
    <rect x="780" y="390" width="360" height="230" class="f-fallacy s-fallacy w-hair"/>
    <text x="960" y="482" text-anchor="middle" class="t-name">nonrational</text>
    <text x="960" y="510" text-anchor="middle" class="t-label t-soft">prerational and transrational</text>
    <text x="960" y="528" text-anchor="middle" class="t-label t-soft">land in the same bin, where</text>
    <text x="960" y="556" text-anchor="middle" class="t-quote-s" font-style="italic">“they appear similar or even identical”</text>
    <text x="960" y="644" text-anchor="middle" class="t-ours">◇ the two-bin picture is this wiki's device for Wilber's sentence</text>
  </g>
  <!-- ghosts: the two outer bands collapse into the one bin (invisible when settled) -->
  <rect x="100" y="200" width="340" height="140" class="wv-ghost f-level s-level w-hair" style="transform-box: fill-box; transform-origin: 0 0; --wv-from: none; --wv-to: translate(680px, 190px) scale(1.06, 0.8);"/>
  <rect x="100" y="480" width="340" height="140" class="wv-ghost f-ground s-ground w-hair" style="transform-box: fill-box; transform-origin: 0 0; --wv-from: none; --wv-to: translate(680px, -40px) scale(1.06, 0.8);"/>
  <g class="wv-fade" style="transition-delay: 500ms">
    <path d="M440 270 C 600 270, 640 470, 776 470" class="nf s-ink w-struct k-dash" marker-end="url(#ptf-m-ink)"/>
    <path d="M440 410 C 600 410, 640 270, 776 270" class="nf s-ink w-struct k-dash" marker-end="url(#ptf-m-ink)"/>
    <path d="M440 550 C 600 550, 640 560, 776 560" class="nf s-ink w-struct k-dash" marker-end="url(#ptf-m-ink)"/>
  </g>

  <!-- step 2: reductionism, down the right edge -->
  <path d="M410 224 C 432 330, 432 500, 410 600" pathLength="1" class="wv-draw nf s-fallacy w-path" marker-end="url(#ptf-m-fallacy)"/>
  <g class="wv-fade">
    <text x="396" y="222" text-anchor="end" class="t-label-b c-fallacy">Reductionism</text>
    <text x="396" y="237" text-anchor="end" class="t-small c-fallacy">the transrational read down as prerational · Freud</text>
  </g>

  <!-- step 3: elevationism, up the left edge -->
  <path d="M130 596 C 108 490, 108 320, 130 220" pathLength="1" class="wv-draw nf s-fallacy w-path" marker-end="url(#ptf-m-fallacy)"/>
  <g class="wv-fade">
    <text x="144" y="602" class="t-label-b c-fallacy">Elevationism</text>
    <text x="144" y="617" class="t-small c-fallacy">the prerational read up as transrational · Jung</text>
  </g>

  <!-- step 4: the passages (settled frame) -->
  <g class="wv-fade">
    <line x1="60" y1="664" x2="1140" y2="664" class="s-faint w-hair"/>
    <text x="60" y="692" class="t-quote-s">“The essence of the pre/trans fallacy is itself fairly simple: since both</text>
    <text x="60" y="712" class="t-quote-s">prerational states and transrational states are, in their own ways,</text>
    <text x="60" y="732" class="t-quote-s">nonrational, they appear similar or even identical to the untutored eye.”</text>
    <text x="60" y="754" class="t-loc">Ken Wilber, <tspan font-style="italic">Sex, Ecology, Spirituality</tspan> (1995), ch. 6</text>

    <text x="640" y="692" class="t-quote-s">“Freud was a reductionist, Jung an elevationist—the two sides of the</text>
    <text x="640" y="712" class="t-quote-s">pre/trans fallacy. And the point is that they are <tspan font-style="italic">both</tspan> half right and</text>
    <text x="640" y="732" class="t-quote-s">half wrong.”</text>
    <text x="640" y="754" class="t-loc">Ken Wilber, <tspan font-style="italic">Sex, Ecology, Spirituality</tspan> (1995), ch. 6</text>

    <text x="60" y="786" class="t-foot">Redrawn from Wilber's description for wilber.wiki; not a reproduction of a published figure. Band descriptions summarise SES ch. 6; ◇ marks this wiki's own device.</text>
    <text x="1140" y="786" text-anchor="end" class="t-mark">wilber.wiki</text>
  </g>
</svg>

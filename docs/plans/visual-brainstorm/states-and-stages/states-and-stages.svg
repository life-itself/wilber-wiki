<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d">
<title id="t">From one ladder (Integral Psychology, 2000) to a lattice of stages and states (Integral Spirituality, 2006)</title>
<desc id="d">Left: a single ladder of ten rungs, archaic to integral and then psychic, subtle, causal, nondual on top. Right: a grid with the six structure-stages up the side and four states across the top, twenty-four cells. An arrow between the panels reads: the four top rungs become the column headers.</desc>
<style>
:root{
  --bg:#f6f3ed; --surface:#fffdf9; --ink:#1c1917; --ink-soft:#57534e; --muted:#8a827b;
  --line:#ddd6cc; --line-strong:#b8afa3;
  --amber:#b45309; --amber-soft:rgba(180,83,9,0.14);
  --teal:#0f766e; --teal-soft:rgba(15,118,110,0.13);
  --rose:#be123c; --rose-soft:rgba(190,18,60,0.12);
  --indigo:#4338ca; --indigo-soft:rgba(67,56,202,0.11);
  --soft-fill:rgba(28,25,23,0.05);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#100f0e; --surface:#1a1816; --ink:#efeae2; --ink-soft:#b8b0a6; --muted:#807870;
  --line:#322e2a; --line-strong:#4d4740;
  --amber:#f59e0b; --amber-soft:rgba(245,158,11,0.18);
  --teal:#2dd4bf; --teal-soft:rgba(45,212,191,0.16);
  --rose:#fb7185; --rose-soft:rgba(251,113,133,0.18);
  --indigo:#a5b4fc; --indigo-soft:rgba(165,180,252,0.16);
  --soft-fill:rgba(239,234,226,0.07);
}}

  svg { background: var(--bg); color: var(--ink); font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  text { fill: currentColor; }
  .serif { font-family: "Fraunces", Georgia, "Times New Roman", serif; }
  .it { font-style: italic; } .b { font-weight: 600; }
  .mut { fill: var(--muted); } .soft { fill: var(--ink-soft); }
  .f-indigo-s { fill: var(--indigo-soft); } .s-indigo { stroke: var(--indigo); } .t-indigo { fill: var(--indigo); }
  .f-teal-s { fill: var(--teal-soft); } .s-teal { stroke: var(--teal); } .t-teal { fill: var(--teal); }
  .f-rose-s { fill: var(--rose-soft); } .s-rose { stroke: var(--rose); } .t-rose { fill: var(--rose); }
  .f-amber-s { fill: var(--amber-soft); } .s-amber { stroke: var(--amber); } .t-amber { fill: var(--amber); }
  .f-soft { fill: var(--soft-fill); } .f-paper { fill: var(--surface); }
  .s-ink { stroke: currentColor; } .s-line { stroke: var(--line-strong); } .s-faint { stroke: var(--line); }
  .nf { fill: none; } .dash { stroke-dasharray: 6 6; }
  .m-ink { fill: currentColor; } .m-rose { fill: var(--rose); } .m-amber { fill: var(--amber); }
  .stagerung rect { fill: var(--soft-fill); stroke: currentColor; stroke-width: 1; }
  .staterung rect { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1; }
  .cell { fill: var(--soft-fill); stroke: var(--line); stroke-width: 1; }
</style>

<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="m-amber"/></marker><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="m-ink"/></marker></defs>
<rect width="1000" height="600" fill="var(--bg)"/>
<text x="190" y="44" text-anchor="middle" class="b mut" font-size="12" letter-spacing="2">INTEGRAL PSYCHOLOGY · 2000</text>
<text x="190" y="66" text-anchor="middle" class="serif it soft" font-size="14">one spine; transpersonal levels on top</text>
<g class="staterung"><rect x="100" y="90" width="180" height="36" rx="6"/><text x="190" y="106" text-anchor="middle" class="b" font-size="13">nondual</text><text x="190" y="119" text-anchor="middle" class="mut" font-size="9">a structure, on the ladder</text></g>
<g class="staterung"><rect x="100" y="132" width="180" height="36" rx="6"/><text x="190" y="148" text-anchor="middle" class="b" font-size="13">causal</text><text x="190" y="161" text-anchor="middle" class="mut" font-size="9">a structure, on the ladder</text></g>
<g class="staterung"><rect x="100" y="174" width="180" height="36" rx="6"/><text x="190" y="190" text-anchor="middle" class="b" font-size="13">subtle</text><text x="190" y="203" text-anchor="middle" class="mut" font-size="9">a structure, on the ladder</text></g>

<g class="stagerung"><rect x="100" y="384" width="180" height="36" rx="6"/><text x="190" y="400" text-anchor="middle" class="b" font-size="13">mythic</text><text x="190" y="413" text-anchor="middle" class="mut" font-size="9">chart 1: Magic-mythic/Mythic-rational</text></g>
<g class="stagerung"><rect x="100" y="426" width="180" height="36" rx="6"/><text x="190" y="442" text-anchor="middle" class="b" font-size="13">magic</text><text x="190" y="455" text-anchor="middle" class="mut" font-size="9">chart 1: Magical</text></g>
<g class="stagerung"><rect x="100" y="468" width="180" height="36" rx="6"/><text x="190" y="484" text-anchor="middle" class="b" font-size="13">archaic</text><text x="190" y="497" text-anchor="middle" class="mut" font-size="9">chart 1: Archaic</text></g>
<line x1="84" y1="504" x2="84" y2="92" class="s-ink" stroke-width="1.5" marker-end="url(#mi)"/>
<text transform="translate(72 300) rotate(-90)" text-anchor="middle" class="mut" font-size="11" letter-spacing="1">higher structures</text>
<path d="M292 104 C 360 62, 480 62, 552 112" class="nf s-amber" stroke-width="2.5" marker-end="url(#m)"/>
<text x="420" y="54" text-anchor="middle" class="b t-amber" font-size="11">the top four rungs</text>
<text x="420" y="68" text-anchor="middle" class="b t-amber" font-size="11">become the column headers</text>
<text x="720" y="44" text-anchor="middle" class="b mut" font-size="12" letter-spacing="2">INTEGRAL SPIRITUALITY · 2006</text>
<text x="720" y="66" text-anchor="middle" class="serif it soft" font-size="14">the Wilber-Combs lattice: stages up the side, states across the top</text>
<text x="430" y="156" class="b mut" font-size="10" letter-spacing="1.5">STRUCTURE-STAGES</text>
<text x="560" y="100" class="b mut" font-size="10" letter-spacing="1.5">STATES</text>
<g class="staterung"><rect x="560" y="110" width="102" height="36" rx="6"/><text x="611" y="126" text-anchor="middle" class="b" font-size="12">gross / psychic</text><text x="611" y="139" text-anchor="middle" class="mut" font-size="9">a state</text></g>

<g class="staterung"><rect x="776" y="110" width="102" height="36" rx="6"/><text x="827" y="126" text-anchor="middle" class="b" font-size="12">causal</text><text x="827" y="139" text-anchor="middle" class="mut" font-size="9">a state</text></g>
<g class="staterung"><rect x="884" y="110" width="102" height="36" rx="6"/><text x="935" y="126" text-anchor="middle" class="b" font-size="12">nondual</text><text x="935" y="139" text-anchor="middle" class="mut" font-size="9">a state</text></g>

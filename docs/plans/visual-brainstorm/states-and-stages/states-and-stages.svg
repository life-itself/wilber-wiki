<g class="stagerung"><rect x="100" y="258" width="180" height="36" rx="6"/><text x="190" y="274" text-anchor="middle" class="b" font-size="13">integral</text><text x="190" y="287" text-anchor="middle" class="mut" font-size="9">chart 1: Holistic-integralism</text></g>
<g class="stagerung"><rect x="100" y="300" width="180" height="36" rx="6"/><text x="190" y="316" text-anchor="middle" class="b" font-size="13">pluralistic</text><text x="190" y="329" text-anchor="middle" class="mut" font-size="9">chart 1: Pluralistic-relativism</text></g>

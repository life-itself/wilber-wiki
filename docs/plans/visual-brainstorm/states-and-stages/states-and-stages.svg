<line x1="40" y1="500" x2="960" y2="500" class="s-faint"/>
<text x="40" y="528" class="serif" font-size="14">“…gross/psychic, subtle, causal, and nondual were no longer stages stacked on top of the Western conventional stages,</text>
<text x="40" y="548" class="serif" font-size="14">but were states (including altered states and peak experiences) that can and did occur alongside any of those stages.”</text>
<text x="40" y="570" class="mut" font-size="11">Ken Wilber, Integral Spirituality (2006), ch. 4. Integral Psychology (2000) already says the states are available “at virtually any stage of growth”;</text>
<text x="40" y="586" class="mut" font-size="11">what changed is the picture, and the weight put on it. Redrawn for wilber.wiki; not a reproduction of a published figure.</text>
<text x="960" y="586" text-anchor="end" class="b mut" font-size="11" letter-spacing="1">wilber.wiki</text>
</svg>
